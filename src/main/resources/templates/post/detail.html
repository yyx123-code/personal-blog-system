<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title} + ' - 我的博客'">文章详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .blog-header { border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
        .post-content { line-height: 1.8; font-size: 1.1rem; }
        .post-content img { max-width: 100%; height: auto; }
        .post-content pre { background-color: #f5f5f5; padding: 15px; border-radius: 5px; }
        .post-content code { background-color: #f5f5f5; padding: 2px 5px; border-radius: 3px; }
        .comment-box { background-color: #fff; border: 1px solid #dee2e6; border-radius: 5px; padding: 20px; margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部导航 -->
    <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
            <div class="col-4 pt-1">
                <a class="link-secondary" href="/">← 返回首页</a>
            </div>
            <div class="col-4 text-center">
                <a class="blog-header-logo text-dark" href="/">技术博客</a>
            </div>
            <div class="col-4 d-flex justify-content-end align-items-center">
                <a class="btn btn-sm btn-outline-secondary" href="#">登录</a>
            </div>
        </div>
    </header>

    <!-- 文章内容 -->
    <article class="blog-post">
        <h1 class="blog-post-title mb-1" th:text="${post.title}">文章标题</h1>

        <div class="post-meta text-muted mb-4">
                <span class="me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664z"/>
                    </svg>
                    <span th:text="${post.author != null ? post.author.username : '匿名'}">作者</span>
                </span>
            <span class="me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
                        <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                    </svg>
                <!-- 关键修复：dates改为temporals -->
                    <span th:text="${#temporals.format(post.createTime, 'yyyy-MM-dd HH:mm')}">发布时间</span>
                </span>
            <span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                    </svg>
                    浏览 <span th:text="${post.viewCount}">0</span> 次
                </span>
        </div>

        <div class="alert alert-info" th:if="${post.status == 'DRAFT'}">
            <strong>提示：</strong>这是一篇草稿，仅作者可见。
        </div>

        <div class="post-content mb-5" th:utext="${post.content}">
            文章内容...
        </div>

        <!-- 标签（预留功能） -->
        <div class="post-tags mb-4">
            <span class="badge bg-secondary me-1">Spring Boot</span>
            <span class="badge bg-secondary me-1">Java</span>
            <span class="badge bg-secondary">嵌入式</span>
        </div>
    </article>

    <!-- 评论区域 -->
    <div class="comment-box">
        <h4 class="mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-chat-left-text" viewBox="0 0 16 16">
                <path d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                <path d="M3 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M3 6a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 6m0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5"/>
            </svg>
            评论 <span class="badge bg-secondary" th:text="${comments != null ? comments.size() : 0}">0</span>
        </h4>

        <!-- 评论列表 -->
        <div th:if="${comments != null && !comments.empty}">
            <div th:each="comment : ${comments}" class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${comment.nickname != null ? comment.nickname : (comment.user != null ? comment.user.username : '匿名用户')}">
                            用户名
                        </h6>
                        <!-- 关键修复：dates改为temporals -->
                        <small class="text-muted" th:text="${#temporals.format(comment.createTime, 'MM-dd HH:mm')}">
                            时间
                        </small>
                    </div>
                    <p class="card-text" th:text="${comment.content}">评论内容...</p>
                </div>
            </div>
        </div>

        <div th:if="${comments == null || comments.empty}" class="alert alert-light">
            还没有评论，快来抢沙发吧！
        </div>

        <!-- 评论表单 -->
        <form th:action="@{/comment/new}" method="post" class="mt-4">
            <div class="mb-3">
                <label for="nickname" class="form-label">昵称</label>
                <input type="text" class="form-control" id="nickname" name="nickname" placeholder="可选，默认显示匿名">
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">评论内容</label>
                <textarea class="form-control" id="content" name="content" rows="3" required></textarea>
            </div>
            <input type="hidden" name="postId" th:value="${post.id}">
            <button type="submit" class="btn btn-primary">发表评论</button>
        </form>
    </div>

    <!-- 页脚 -->
    <footer class="blog-footer mt-5 pt-4 border-top">
        <p>© 2024 技术博客 - 记录学习过程</p>
        <p>
            <a href="/">首页</a> ·
            <a href="/about">关于我</a> ·
            <a href="https://github.com" target="_blank">GitHub</a>
        </p>
    </footer>
</div>

<!-- 代码高亮 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script>
    // 自动刷新Prism高亮
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof Prism !== 'undefined') {
            Prism.highlightAll();
        }
    });
</script>
</body>
</html>
