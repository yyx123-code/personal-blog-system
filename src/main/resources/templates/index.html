<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的博客 - 测试版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .user-actions {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .welcome-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .login-info {
            background: #e8f4fd;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<!-- 用户操作按钮 - 简洁版 -->
<div class="user-actions">
    <!-- 如果已经登录，显示用户名和退出按钮 -->
    <div th:if="${username}" class="d-flex align-items-center">
        <span class="me-3">已登录: <strong th:text="${username}"></strong></span>
        <a href="/user/logout" class="btn btn-sm btn-outline-danger">退出登录</a>
    </div>

    <!-- 如果未登录，显示注册/登录按钮 -->
    <div th:unless="${username}">
        <a href="/user/register" class="btn btn-sm btn-primary">注册</a>
        <a href="/user/login" class="btn btn-sm btn-outline-secondary ms-2">登录</a>
    </div>
</div>

<div class="container">
    <h1>我的博客 - 测试页面</h1>

    <!-- 登录状态信息 -->
    <div th:if="${username}" class="login-info">
        ✅ 当前已登录用户: <strong th:text="${username}"></strong>
        <a href="/user/logout" class="btn btn-sm btn-outline-danger ms-3">退出</a>
    </div>

    <!-- 欢迎消息（登录后显示） -->
    <div th:if="${welcomeMessage}" class="welcome-message">
        <span th:text="${welcomeMessage}"></span>
    </div>

    <!-- 调试信息 -->
    <div class="alert alert-info debug" th:text="${message}">消息</div>

    <!-- 导航 -->
    <nav class="mb-4">
        <a href="/" class="btn btn-sm btn-outline-primary">首页</a>
        <a href="/about" class="btn btn-sm btn-outline-secondary">关于</a>
        <a href="/post/1" class="btn btn-sm btn-outline-success">测试文章1</a>
        <a href="/post/2" class="btn btn-sm btn-outline-success">测试文章2</a>
        <!-- 如果未登录，显示登录按钮 -->
        <a th:unless="${username}" href="/user/login" class="btn btn-sm btn-outline-warning">去登录</a>
    </nav>

    <hr>

    <!-- 文章列表 -->
    <h3>文章列表</h3>
    <div th:if="${posts.empty}">
        <p class="text-muted">暂无文章</p>
    </div>

    <div th:each="post : ${posts}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${post.title}">标题</h5>
            <p class="card-text" th:text="${post.summary}">摘要</p>
            <div class="text-muted small">
                发布时间: <span th:text="${#temporals.format(post.createTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                · 浏览: <span th:text="${post.viewCount}">0</span>次
            </div>
            <a th:href="@{'/post/' + ${post.id}}" class="btn btn-primary btn-sm mt-2">阅读全文</a>
        </div>
    </div>

    <hr>

    <!-- 测试链接 -->
    <div class="mt-4">
        <h5>快速测试：</h5>
        <a href="/post/1" class="btn btn-outline-dark">文章1</a>
        <a href="/post/2" class="btn btn-outline-dark">文章2</a>
        <a href="/post/999" class="btn btn-outline-danger">不存在的文章</a>
    </div>
</div>
</body>
</html>
