<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4">用户注册</h2>

    <!-- 成功消息（放在更显眼的位置） -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>成功！</strong> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <div class="mt-2">
            <a href="/user/login" class="btn btn-sm btn-outline-success">去登录</a>
            <a href="/" class="btn btn-sm btn-outline-secondary ms-2">返回首页</a>
        </div>
    </div>

    <!-- 错误消息 -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>错误！</strong> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 使用th:object绑定表单 -->
    <form th:action="@{/user/register}" method="post" th:object="${userRegisterDTO}">
        <div class="mb-3">
            <label for="username" class="form-label">用户名</label>
            <input type="text" class="form-control" id="username"
                   th:field="*{username}" placeholder="3-20个字符" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">密码</label>
            <input type="password" class="form-control" id="password"
                   th:field="*{password}" placeholder="6-20个字符" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">邮箱</label>
            <input type="email" class="form-control" id="email"
                   th:field="*{email}" placeholder="example@email.com" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">注册</button>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS (用于alert关闭功能) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
